# Render.com Blueprint - Deploy entire app with one click
# Documentation: https://render.com/docs/blueprint-spec

services:
  # Frontend - Static Site
  - type: web
    name: multilingual-chat-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://multilingual-chat-backend.onrender.com/api
      - key: VITE_WS_URL
        value: https://multilingual-chat-backend.onrender.com
      - key: VITE_TRANSLATION_API_URL
        value: https://multilingual-chat-backend.onrender.com/translation-api
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

  # Backend - Chat Service (Main API + Socket.IO)
  - type: web
    name: multilingual-chat-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd backend/services/chat-service && npm install && npm run build
    startCommand: cd backend/services/chat-service && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        generateValue: true  # Auto-generates secure secret
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: multilingual-chat-db
          property: connectionString

databases:
  # PostgreSQL Database
  - name: multilingual-chat-db
    databaseName: multilingual_chat
    user: multilingual_user
    plan: free
    region: oregon
